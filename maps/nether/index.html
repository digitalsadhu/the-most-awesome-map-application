<!DOCTYPE html>
<html>

<head>
    <title>The Most Awesome map of the Nether</title>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

    <!-- OpenLayers  -->
    <link rel="stylesheet" type="text/css" href="lib/ol.css">
    <script src="lib/ol.js"></script>

    <!-- OpenLayers Context Menu -->
    <link href="lib/ol-contextmenu.css" rel="stylesheet">
    <script src="lib/ol-contextmenu.iife.js"></script>

    <!-- Toastify -->
    <script type="text/javascript" src="lib/toastify-js.js"></script>
    <link rel="stylesheet" type="text/css" href="lib/toastify-js.min.css">


    <!-- Map metadata generated by uNmINeD -->
    <script type="text/javascript" src="unmined.map.properties.js"></script>
    <script type="text/javascript" src="unmined.map.regions.js"></script>
    <script type="text/javascript" src="unmined.map.players.js"></script>

    <!-- Custom markers -->
    <script type="text/javascript" src="custom.markers.js"></script>

    <!-- uNmINeD JS and CSS -->
    <script type="text/javascript" src="unmined.js"></script>
    <script src="../fuzzysort.min.js"></script>
    <link rel="stylesheet" type="text/css" href="../index.css">

</head>

<body>
    <nav popover id="dimensions-nav" aria-label="Minecraft dimension maps">
        <ul>
            <li>
                <a href="/">Overworld</a>
            </li>
            <li>
                <a href="#" aria-current="page">Nether</a>
            </li>
            <li>
                <a href="/end">End</a>
            </li>
        </ul>
    </nav>

    <div popover id="poi-search">
        <form name="search">
            <label for="poi-filter" class="visually-hidden">Filter points of interest</label>
            <div class="marker-name-filter">
                <img height="16px" width="16px" src="/icons/search.svg" alt="">
                <input id="poi-filter" name="poi-filter" placeholder="Filter points of interest">
                <button id="clear-filter" type="button" popovertarget="poi-search" popovertargetaction="hide">
                    <span class="visually-hidden">Clear filters</span>
                    <img height="16px" width="16px" src="/icons/close.svg" alt="">
                </button>
            </div>
            <div class="scroll-x">
                <fieldset aria-labelledby="marker-filters-heading" name="marker-types">
                </fieldset>
            </div>
        </form>

        <ul id="search-results">
        </ul>
    </div>

    <section class="map-controls" aria-labelledby="map-controls-heading">
        <h2 id="map-controls-heading" class="visually-hidden">
            Map controls
        </h2>
        <ul>
            <li>
                <button popovertarget="poi-search">
                    <span class="visually-hidden">Search</span>
                    <img height="16px" width="16px" src="/icons/search.svg" alt="magnifying glass">
                </button>
            </li>
            <li>
                <button popovertarget="marker-filters">
                    <span class="visually-hidden">Marker filters</span>
                    <img height="16px" width="16px" src="/icons/settings.svg" alt="settings">
                </button>
            </li>
            <li>
                <button popovertarget="dimensions-nav">
                    <span class="visually-hidden">Dimensions</span>
                    <img height="16px" width="16px" src="/icons/layers.svg" alt="layers">
                </button>
            </li>
            <li id="zoom-controls-container">
                <!-- Map zoom controls get moved here using JS -->
            </li>
        </ul>
    </section>

    <section popover id="marker-filters" aria-labelledby="marker-filters-heading">
        <h2 class="visually-hidden" id="marker-filters-heading">Filter marker types</h2>
        <form name="markers-filter">
            <fieldset aria-labelledby="marker-filters-heading" name="marker-types">
            </fieldset>
        </form>
    </section>

    <div id="map"></div>

    <script type="text/javascript" src="../map.js"></script>
</body>

</html>
