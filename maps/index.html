<!DOCTYPE html>
<html>

<head>
    <title>uNmINeD</title>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

    <!-- OpenLayers  -->
    <link rel="stylesheet" type="text/css" href="lib/ol.css">
    <script src="lib/ol.js"></script>

    <!-- OpenLayers Context Menu -->
    <link href="lib/ol-contextmenu.css" rel="stylesheet">
    <script src="lib/ol-contextmenu.iife.js"></script>

    <!-- Toastify -->
    <script type="text/javascript" src="lib/toastify-js.js"></script>
    <link rel="stylesheet" type="text/css" href="lib/toastify-js.min.css">


    <!-- Map metadata generated by uNmINeD -->
    <script type="text/javascript" src="unmined.map.properties.js"></script>
    <script type="text/javascript" src="unmined.map.regions.js"></script>
    <script type="text/javascript" src="unmined.map.players.js"></script>

    <!-- Custom markers -->
    <script type="text/javascript" src="custom.markers.js"></script>

    <!-- uNmINeD JS and CSS -->
    <script type="text/javascript" src="unmined.js"></script>
    <script src="fuzzysort.min.js"></script>
    <link rel="stylesheet" type="text/css" href="index.css">

</head>

<body>
    <nav popover id="dimensions-nav" aria-label="Minecraft dimension maps">
        <ul>
            <li>
                <a href="#" aria-current="page">Overworld</a>
            </li>
            <li>
                <a href="/nether">Nether</a>
            </li>
            <li>
                <a href="/end">End</a>
            </li>
        </ul>
    </nav>

    <search popover id="poi-search">
        <form name="search">
            <label for="poi">Search for a point of interest</label>
            <select id="poi" name="poi">
                <button>
                    <selectedcontent></selectedcontent>
                </button>
                <option value="">Points of interest</option>
            </select>
        </form>
    </search>

    <section class="map-controls" aria-labelledby="map-controls-heading">
        <h2 id="map-controls-heading" class="visually-hidden">
            Map controls
        </h2>
        <ul>
            <li>
                <button popovertarget="poi-search">Search</button>
            </li>
            <li>
                <button popovertarget="marker-filters">Marker filters</button>
            </li>
            <li>
                <button popovertarget="dimensions-nav">Dimensions</button>
            </li>
            <li id="zoom-controls-container">
                <!-- Map zoom controls get moved here using JS -->
            </li>
        </ul>
    </section>

    <section popover id="marker-filters" aria-labelledby="marker-filters-heading">
        <h2 id="marker-filters-heading">Marker filters</h2>
        <!-- This popover is a selectlist widget -->
    </section>

    <div id="map"></div>

    <script type="text/javascript">

        document.title = UnminedMapProperties.worldName.replace(" - Copy", "") + " - " + document.title;

        if (UnminedCustomMarkers && UnminedCustomMarkers.isEnabled && UnminedCustomMarkers.markers) {
            UnminedMapProperties.markers = UnminedMapProperties.markers.concat(UnminedCustomMarkers.markers);
        }

        if (UnminedPlayers && UnminedPlayers.length > 0) {
            UnminedMapProperties.playerMarkers = Unmined.createPlayerMarkers(UnminedPlayers);
        }

        const mapElement = document.getElementById('map');
        const unmined = new Unmined(mapElement, UnminedMapProperties, UnminedRegions);

        let zoomControls = document.querySelector('.ol-zoom');
        if (zoomControls) {
            zoomControls.remove();
            document.getElementById('zoom-controls-container').appendChild(zoomControls);
        }


        const datalist = document.getElementById("poi");
        for (const marker of UnminedMapProperties.markers) {
            if (!marker.text) continue;
            const listentry = document.createElement("option");
            const poiText = marker.text.replaceAll("\n", " ");

            listentry.innerHTML = `
                <span class="icon" aria-hidden="true">
                    <img src="/${PINS[marker.type] || "other.png"}" alt="">
                </span>
                <span>${poiText}</span>
            `;

            listentry.setAttribute("value", poiText);
            datalist.appendChild(listentry);
        }

        document.forms.search.addEventListener('change', async function (e) {
            e.preventDefault();
            const name = document.getElementById("poi").value;
            const results = fuzzysort.go(name, UnminedMapProperties.markers, { key: 'text' });
            if (results.length) {
                const marker = results[0].obj;
                unmined.center([
                    marker.x,
                    marker.z,
                ]);
            }
        });

    </script>
</body>

</html>
